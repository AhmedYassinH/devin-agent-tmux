  - dialog "Guide" [ref=e183]:
    - banner [ref=e184]:
      - heading "The Guide" [level=2] [ref=e185]
      - button "Close guide" [ref=e186] [cursor=pointer]: ✕
    - paragraph [ref=e187]:
      - text: Run many Devin CLI agents in parallel, in your browser. Each pane is the real
      - code [ref=e188]: devin
      - text: terminal — this app arranges them, watches them, and remembers them.
    - generic [ref=e189]:
      - generic [ref=e190]:
        - generic [ref=e191]:
          - generic [ref=e192]: Workspaces
          - generic [ref=e194]: "01"
        - paragraph [ref=e195]: A workspace is a named group of Devin sessions with its own layout and a default working directory. Add one with + New workspace, rename with ✎ (or double-click), and remove with ✕. Point it at a project directory — Devin scopes its sessions by directory and warns when run from your home folder.
      - generic [ref=e196]:
        - generic [ref=e197]:
          - generic [ref=e198]: Terminals & layout
          - generic [ref=e200]: "02"
        - paragraph [ref=e201]: Pick 1–6 from the Terminals dropdown. Drag the dividers to resize; the terminals reflow. Reset re-evens the splits without touching the running processes. Closing a pane with ✕ shrinks the grid — the slot goes away rather than leaving an empty launcher behind.
      - generic [ref=e202]:
        - generic [ref=e203]:
          - generic [ref=e204]: Run an agent
          - generic [ref=e206]: "03"
        - paragraph [ref=e207]:
          - text: In an empty pane, optionally name it, confirm the working directory, and hit Run Devin (or Shell for a plain terminal). Each pane is the real
          - code [ref=e208]: devin
          - text: "TUI, so everything works as it does in your terminal: slash commands,"
          - code [ref=e209]: /model
          - text: to switch model,
          - code [ref=e210]: Shift+Tab
          - text: to cycle the permission mode. Panes start with edits auto-approved.
      - generic [ref=e211]:
        - generic [ref=e212]:
          - generic [ref=e213]: Status & attention
          - generic [ref=e215]: "04"
        - paragraph [ref=e216]: "Every pane and sidebar row carries a live status — idle, running, waiting, exited — driven by Devin's own lifecycle hooks, not by guessing at terminal output. When an agent needs you its pane header lights amber, its workspace gets a marker, and the count appears at the top right. That's the point of running six at once: you work by exception instead of watching panes."
      - generic [ref=e217]:
        - generic [ref=e218]:
          - generic [ref=e219]: Resume a past session
          - generic [ref=e221]: "05"
        - paragraph [ref=e222]:
          - text: Sessions lists every Devin conversation on this machine. Resume relaunches one with
          - code [ref=e223]: devin -r
          - text: in its own new workspace, at the directory it originally ran in — that flag only works from there. Sessions marked locked are open in a running process; Devin allows one holder at a time.
      - generic [ref=e224]:
        - generic [ref=e225]:
          - generic [ref=e226]: Trace a session
          - generic [ref=e228]: "06"
        - paragraph [ref=e229]: "Trace replays a conversation turn by turn: prompts, replies, thinking, and every tool call paired with its result, duration and file diff. It reads Devin's own record over ACP, so nothing is reconstructed or copied. Live panes can't be traced while they run — the same one-holder lock — so trace a session once its pane is closed."
      - generic [ref=e230]:
        - generic [ref=e231]:
          - generic [ref=e232]: Context health
          - generic [ref=e234]: "07"
        - paragraph [ref=e235]: "The % readout estimates how full a pane's context window is: green, amber past 50%, red past 70%, where quality starts degrading well before the hard limit. It's an estimate — Devin reports cumulative token totals, so the figure is derived from per-turn deltas. Hover it for the exact counts and the model's real window."
      - generic [ref=e236]:
        - generic [ref=e237]:
          - generic [ref=e238]: Where your state lives
          - generic [ref=e240]: "08"
        - paragraph [ref=e241]:
          - text: Workspaces, layouts and sessions are saved to
          - code [ref=e242]: ~/.devin-agent-tmux/
          - text: as one readable JSON file per entity —
          - code [ref=e243]: cat
          - text: "it, diff it, back it up. Everything runs on this machine: your agents, your code, your Devin credentials. Nothing is uploaded unless you configure the optional Convex mirror."
